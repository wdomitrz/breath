[package]
name = "breath"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "A paced-breathing pacer, in Rust"

[lib]
name = "breath"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
usvg = { version = "0.48", default-features = false }
resvg = { version = "0.48", default-features = false }
tiny-skia = "0.12"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
# The audio feature list is not just the seven names in the spec. Reading
# web-sys 0.3.105's own `#[cfg]` attributes, the calls this app makes need
# three more: `AudioParam` for `oscillator.frequency` and `gain.gain`,
# `AudioNode` for `connect()`, and `AudioDestinationNode` for
# `AudioContext::destination`. Each is separately gated, and the spec's list
# does not enable any of them.
#
# `Navigator` is needed for one thing -- `Window::navigator`, which is how the
# service worker is registered -- and `web-sys` gates even that property behind
# the feature, although no browser has ever lacked it.
#
# `ServiceWorker`, `RegistrationOptions` and `Url` are here for one fix: the
# scope the worker is registered for is stated rather than inherited, and a
# wider registration left behind by an earlier version is unregistered. Both
# need the registration's `active()` worker (`ServiceWorker`, for
# `script_url`) and the URL type; `Location` is `Window::location`, which is how
# the app's own directory is resolved on the page side.
#
# Deliberately absent: `MediaQueryList`. `prefers-color-scheme` and
# `prefers-reduced-motion` are handled in the shell's CSS, exactly as the
# original CSS did, so Rust never asks the media-query values.
web-sys = { version = "0.3.105", features = [
  "Window", "Document", "Element", "Node", "HtmlElement", "HtmlInputElement",
  "HtmlButtonElement", "Event", "EventTarget", "Performance", "Storage",
  "CssStyleDeclaration", "ServiceWorkerContainer", "ServiceWorkerRegistration",
  "ServiceWorker", "RegistrationOptions", "Location", "Url", "Navigator",
  "AudioContext", "AudioContextState", "OscillatorNode", "OscillatorType",
  "GainNode", "AudioScheduledSourceNode",
  "AudioParam", "AudioNode", "AudioDestinationNode",
  "console"
] }

[lints.rust]
warnings = "deny"

[profile.release]
strip = true
lto = true
opt-level = "s"
