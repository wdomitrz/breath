#
# Publish the pacer to GitHub Pages.
#
# Why this is a separate workflow rather than extra steps in `build.yml`:
# Pages deploys need `pages: write` and `id-token: write` and a
# `github-pages` environment, and `build.yml` runs on every pull request,
# including from a fork, where none of the three exists. Splitting them keeps
# `build.yml` honest -- it stays runnable by anyone who can push a branch, with
# `contents: read` only -- and leaves the thing that can overwrite the live
# site on exactly one ref.
#
# It builds the site again rather than promoting `build.yml`'s artifact:
# `upload-artifact` does not preserve the executable bit or empty directories,
# and the Pages artifact is a tarball anyway. Two builds of a one-crate site is
# cheaper than debugging a published site that is missing its app.
#
# There is deliberately NO `RUSTFLAGS: --cfg=web_sys_unstable_apis` here, and
# `tests/shell.rs` asserts its absence. That cfg is only needed by crates that
# call the Screen Wake Lock API, which is `#[cfg(web_sys_unstable_apis)]` in
# web-sys 0.3.105 in its entirety. This crate does not: there is no Wake Lock
# use anywhere in `src/`, and a clean build with `RUSTFLAGS` unset finishes
# green (verified 2026-10-02 on a fresh target directory). `chess_clock` needs
# the flag and this does not; copying its workflow wholesale is how a crate ends
# up carrying a compiler flag for an API it never calls.

name: pages

# `concurrency` is not a preference. Pages holds a single deployment slot per
# site, and two deploys racing each other can interleave so that the older one
# is published last -- a live site a version behind master, with both jobs
# green. A newer commit must always win the slot.
concurrency:
  group: pages
  cancel-in-progress: false

on:
  # Every commit that lands on master is deployed, and nothing else. No tag
  # trigger: a tagged commit that never reached master would be published.
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  # Must equal the `wasm-bindgen = "=0.2.128"` pin in Cargo.toml. A mismatched
  # generator emits bindings the runtime will not load, and the page then fails
  # to start with "Could not load the breathing pacer" -- which reads as an app
  # bug and is not one. `tests/shell.rs` asserts the two agree.
  WASM_BINDGEN_VERSION: 0.2.128

permissions:
  contents: read

jobs:
  build:
    name: Build the pacer
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache the Cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ job.job }}

      - name: Install the pinned wasm-bindgen generator
        run: |
          set -euuo pipefail
          # The official prebuilt binary, not `cargo install`: the CLI is pinned
          # to one exact version and `cargo install` would compile it from
          # source. The release publishes a musl static binary plus a
          # `.sha256sum` per platform, so verify against that file and fail
          # loudly rather than generating bindings from an unverified download.
          #
          # The digest is checked against the release's own checksum file and
          # then against the digest recorded here. Both, because they fail
          # differently: the first catches a corrupted or truncated download,
          # the second catches a legitimately re-uploaded release -- which is
          # the one an attacker would want, since only they can re-upload it.
          version="$WASM_BINDGEN_VERSION"
          target=x86_64-unknown-linux-musl
          asset="wasm-bindgen-${version}-${target}.tar.gz"
          base="https://github.com/rustwasm/wasm-bindgen/releases/download/${version}"
          pinned=b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f

          curl --fail --location --silent --show-error --retry 3 \
            --output "/tmp/${asset}" "${base}/${asset}"
          curl --fail --location --silent --show-error --retry 3 \
            --output "/tmp/${asset}.sha256sum" "${base}/${asset}.sha256sum"

          # The published checksum file names the asset `gh-release/<name>`,
          # because that is where the release workflow unpacked it, so
          # `sha256sum -c` against the download name finds no file to verify.
          # Take the digest out by field and check it ourselves -- first against
          # what we downloaded, then against the digest recorded in this
          # repository.
          published="$(awk '{print $1}' "/tmp/${asset}.sha256sum")"
          test -n "$published" \
            || { echo "::error::the release published an empty checksum for ${asset}"; exit 1; }
          actual="$(sha256sum "/tmp/${asset}" | cut -d' ' -f1)"
          test "$actual" = "$published" \
            || { echo "::error::${asset} does not match its published checksum (${published}, got ${actual})"; exit 1; }
          test "$actual" = "$pinned" \
            || { echo "::error::${asset} matches its published checksum but not the digest recorded in the repository; re-verify it before accepting this download"; exit 1; }
          echo "${asset}: ${actual} verified against the release and the repository"

          mkdir -p "$HOME/.cargo/bin"
          tar --extract --gzip --file "/tmp/${asset}" \
            --directory "$HOME/.cargo/bin" \
            --strip-components 1 \
            "wasm-bindgen-${version}-${target}/wasm-bindgen"
          chmod +x "$HOME/.cargo/bin/wasm-bindgen"
          test "$("$HOME/.cargo/bin/wasm-bindgen" --version)" = "wasm-bindgen ${version}" \
            || { echo "::error::the installed generator does not report ${version}"; exit 1; }
          echo "wasm-bindgen $("$HOME/.cargo/bin/wasm-bindgen" --version) ready"

      - name: Build the pacer (wasm target)
        run: |
          set -eu
          cargo build --locked --lib --target wasm32-unknown-unknown --release

      - name: Generate the web bindings
        run: |
          set -eu
          # Writes dist/app.js and dist/app_bg.wasm -- the pacer itself. They
          # exist nowhere else in the tree: they are gitignored build output, so
          # a Pages build serving committed files would publish a page that
          # loads and never starts. This step is why the workflow exists.
          wasm-bindgen --target web --no-typescript --out-dir dist --out-name app \
            target/wasm32-unknown-unknown/release/breath.wasm

      - name: Build the rest of the site
        run: |
          set -eu
          # `build.rs` writes the six files it owns -- the shell, the service
          # worker with its version substituted, the two rasterized icons and
          # the manifest -- and derives the worker's content cache version. It
          # must run after the bindings step: the version is hashed from what
          # the previous step wrote, so running it first would pin the cache to
          # whatever the last build left behind.
          #
          # The touch is not redundant. `build.rs` writes into the source tree,
          # not OUT_DIR, so cargo cannot see that anything changed and will not
          # re-run it for a second, otherwise identical invocation. The first
          # build after the bindings step only recompiles the crate; the second
          # would be a no-op and copy nothing -- leaving `dist/` with the two
          # wasm artefacts and none of the six shell files, which is exactly
          # the half-built site this repository has shipped before.
          touch build.rs
          cargo build --release --locked

      - name: Check the built site
        run: |
          set -eu
          # No test can assert on `dist/`: it is gitignored, so the release
          # gate's exported tree never has it (see tests/shell.rs). This build
          # is therefore the only thing that ever checks it -- so check it here,
          # rather than trusting a green job to mean the site is whole. Verify
          # the files, never the exit status: a build that produced seven of
          # the eight is a publishable-looking site with no app in it, and that
          # has happened in this repository.
          expected="app.js app_bg.wasm icon-192.png icon-512.png icon.svg index.html manifest.webmanifest service-worker.js"
          missing=""
          for file in $expected; do
            if [ -s "dist/${file}" ]; then
              echo "  ok   dist/${file} ($(stat -c%s "dist/${file}") bytes)"
            else
              missing="${missing} ${file}"
            fi
          done
          # One pattern per line: `grep -x -F -v -f` reads fixed strings from a
          # file, one per line. Matching the whole space-separated list in one
          # pattern matches nothing, so every file reads as unexpected and the
          # check fails on a perfectly good build.
          printf '%s\n' $expected >/tmp/expected-files
          extra="$(cd dist && ls | grep -x -F -v -f /tmp/expected-files || true)"
          if [ -n "$missing" ] || [ -n "$extra" ]; then
            echo "::error::the site is incomplete -- missing:${missing:- none}; unexpected:${extra:- none}"
            exit 1
          fi
          # A file of a few bytes is a truncated write, not a successful build.
          test -s dist/app_bg.wasm || { echo "::error::the pacer wasm is empty"; exit 1; }
          # The cache version is derived at build time, so an unsubstituted
          # placeholder would ship a service worker that never invalidates.
          if grep -q '__VERSION__' dist/service-worker.js; then
            echo "::error::dist/service-worker.js still carries the __VERSION__ placeholder"
            exit 1
          fi
          # The bindings must actually be bindings: the page loads this file
          # with a dynamic import, so a truncated one fails only in a browser,
          # long after the build looked fine.
          grep -q 'export' dist/app.js \
            || { echo "::error::dist/app.js carries no exports; the page's dynamic import would fail"; exit 1; }
          # And they must carry the start function the page's `m.default()`
          # call runs. Without it the module loads and the pacer never starts,
          # a failure with no error message anywhere.
          grep -q '__wbindgen_start' dist/app.js \
            || { echo "::error::dist/app.js has no start function; the pacer would load and never run"; exit 1; }
          # The icons must be real, square PNGs at the sizes the manifest
          # declares, rasterized from the committed SVG.
          for size in 192 512; do
            test "$(head -c 8 "dist/icon-${size}.png" | od -An -tx1 | tr -d ' \n')" = "89504e470d0a1a0a" \
              || { echo "::error::dist/icon-${size}.png is not a PNG"; exit 1; }
          done
          # The page must call the initializer. A one-line check for a failure
          # that is otherwise completely silent.
          grep -q 'm.default()' dist/index.html \
            || { echo "::error::dist/index.html does not initialise the bindings; the pacer would never start"; exit 1; }

      - name: Run the tests
        run: cargo test --locked

      - name: Lint
        run: |
          set -eu
          # Both targets, as AGENTS.md requires. The crate denies warnings, but
          # only for the target being compiled, so a clean host build says
          # nothing about the wasm one.
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # `upload-pages-artifact` is NOT `upload-artifact`. The Pages
          # artifact is a single tarball the deploy action then finds *by
          # name*; a plain upload produces a green build followed by a deploy
          # that cannot find what it was given. `github-pages` is this action's
          # default name, stated here so the deploy step's `artifact_name` has
          # something visibly to match.
          name: github-pages
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    # Only a build for master publishes. The trigger already says `branches:
    # [master]`, so this is belt and braces -- but the trigger is one line
    # above the job and this is the line that decides whether the live site is
    # overwritten. Being explicit here means a trigger widened later does not
    # silently hand every branch a publish button.
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest

    # The environment is what makes the deploy honour the repository's Pages
    # approval rules, so a protected branch or a reviewer-gated environment can
    # still hold the live site back.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          # By *name*, not by id. `deploy-pages` v5 has no `artifact_id` input:
          # passing one is warned about as `Unexpected input(s) 'artifact_id'`
          # and ignored, leaving the action to fall back to its own default.
          # The name is stated on both sides so a mismatch is a diff rather
          # than a bare `HttpError: Not Found` at deploy time.
          artifact_name: github-pages
